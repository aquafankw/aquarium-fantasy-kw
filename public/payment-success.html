<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من الدفع | Aquafan Kuwait</title><link rel="stylesheet" href="/style.css"><style>.payment-page{min-height:100vh;display:grid;place-items:center;padding:24px}.payment-card{width:min(520px,100%);padding:34px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:var(--shadow);text-align:center}.payment-card h1{color:var(--deep)}.payment-card a{display:inline-block;margin-top:18px;background:var(--deep);color:#fff;padding:11px 20px;border-radius:999px;text-decoration:none}.payment-status{color:var(--muted)}</style></head><body><main class="payment-page"><section class="payment-card"><img src="/assets/aquafan.jpg" width="72" height="72" style="border-radius:50%" alt="Aquafan"><h1 id="title">جاري التحقق من الدفع…</h1><p class="payment-status" id="status">لا تغلقي الصفحة.</p><p id="order"></p><a href="/">العودة إلى المتجر</a></section></main><script>const params=new URLSearchParams(location.search);const paymentId=params.get('paymentId')||params.get('paymentid');const title=document.getElementById('title');const status=document.getElementById('status');const order=document.getElementById('order');(async()=>{if(!paymentId){title.textContent='تعذّر التحقق من الدفع';status.textContent='رقم الدفع غير موجود.';return}try{const response=await fetch('/api/verify-payment?paymentId='+encodeURIComponent(paymentId),{cache:'no-store'});const result=await response.json();if(response.ok&&result.paid){title.textContent='تم الدفع بنجاح';status.textContent='شكرًا لك، تم تأكيد عملية الدفع.';order.textContent=result.orderId?'رقم الطلب: '+result.orderId:'';localStorage.removeItem('aquafan-cart')}else{title.textContent='الدفع غير مكتمل';status.textContent='لم تؤكد MyFatoorah اكتمال عملية الدفع.'}}catch{title.textContent='تعذّر التحقق من الدفع';status.textContent='حاولي تحديث الصفحة بعد قليل.'}})();</script></body></html>
